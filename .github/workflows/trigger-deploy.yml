name: Trigger platform deploy

# VPS_* только в platform Environment. PAT в ui → workflow_dispatch на platform@test|main.

on:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/trigger-deploy.yml'

  deploy-test:
    needs: changes
    if: github.ref == 'refs/heads/test' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run platform deploy-web-ui (test)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'couragegang',
              repo: 'platform',
              workflow_id: 'deploy-web-ui.yml',
              ref: 'test',
              inputs: {
                contour: 'test',
                sha: context.sha,
              },
            });

  deploy-prod:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run platform deploy-web-ui (prod)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'couragegang',
              repo: 'platform',
              workflow_id: 'deploy-web-ui.yml',
              ref: 'main',
              inputs: {
                contour: 'prod',
                sha: context.sha,
              },
            });
