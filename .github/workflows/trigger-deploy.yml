name: Trigger platform deploy

on:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/trigger-deploy.yml'

  deploy-test:
    needs: changes
    if: github.ref == 'refs/heads/test' && needs.changes.outputs.web == 'true'
    uses: couragegang/platform/.github/workflows/deploy-web-ui.yml@test
    with:
      contour: test
      sha: ${{ github.sha }}
      trigger_repository: ${{ github.repository }}

  deploy-prod:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    uses: couragegang/platform/.github/workflows/deploy-web-ui.yml@main
    with:
      contour: prod
      sha: ${{ github.sha }}
      trigger_repository: ${{ github.repository }}
