name: Trigger platform deploy

# VPS_* только в platform. GITHUB_TOKEN не вызывает другой репозиторий → PLATFORM_DISPATCH_TOKEN (PAT).

on:
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/trigger-deploy.yml'

  deploy-test:
    needs: changes
    if: github.ref == 'refs/heads/test' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch platform deploy (test)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'couragegang',
              repo: 'platform',
              event_type: 'deploy-ui',
              client_payload: {
                contour: 'test',
                sha: context.sha,
                trigger_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            });

  deploy-prod:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch platform deploy (prod)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'couragegang',
              repo: 'platform',
              event_type: 'deploy-ui',
              client_payload: {
                contour: 'prod',
                sha: context.sha,
                trigger_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            });
